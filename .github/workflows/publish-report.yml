name: Publish Playwright Report

# Runs after the test workflow finishes and publishes its HTML report
# to GitHub Pages, so the report is browsable at a URL instead of a zip.
on:
  workflow_run:
    workflows: ['Playwright Tests']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download report from the test run
        uses: actions/download-artifact@v4
        with:
          name: playwright-html-report
          path: html-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: html-report

      - id: deploy
        uses: actions/deploy-pages@v4
